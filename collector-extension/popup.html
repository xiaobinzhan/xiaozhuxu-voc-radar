<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>省心租采集器</title>
  <style>
    body { width: 300px; padding: 16px; font-family: -apple-system, sans-serif; font-size: 13px; }
    h1 { font-size: 15px; margin: 0 0 12px; }
    .status { padding: 8px 12px; border-radius: 6px; margin-bottom: 12px; }
    .status.ok { background: #e6f4ea; color: #137333; }
    .status.err { background: #fce8e6; color: #c5221f; }
    .status.idle { background: #f1f3f4; color: #5f6368; }
    button { width: 100%; padding: 8px; border: none; border-radius: 6px; background: #1a73e8; color: #fff; cursor: pointer; font-size: 13px; }
    button:disabled { background: #ccc; }
    .info { margin-top: 12px; color: #5f6368; font-size: 12px; }
  </style>
</head>
<body>
  <h1>省心租 VOC 采集器</h1>
  <div id="status" class="status idle">加载中...</div>
  <button id="syncBtn" onclick="triggerSync()">立即同步</button>
  <div class="info">
    <p>1. 先在 Chrome 登录 xiaohongshu.com</p>
    <p>2. 点击"立即同步"开始采集</p>
    <p>3. 服务地址: <span id="svcUrl">http://127.0.0.1:8000</span></p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
